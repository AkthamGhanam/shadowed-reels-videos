name: YouTube scheduler
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency: youtube-scheduler
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upload pending videos
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: |
          if [ -z "$YT_REFRESH_TOKEN" ]; then echo "Secrets not set yet"; exit 0; fi
          python3 scheduler/upload.py
      - name: Save results
        run: |
          git config user.name "scheduler-bot"
          git config user.email "scheduler-bot@users.noreply.github.com"
          git add scheduler/queue.json
          git diff --cached --quiet || (git commit -m "Update upload queue" && git push)
